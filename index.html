<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c1012">
    <title>Subdiv — Tap Tempo Subdivision Calculator</title>
    <style>
      :root {
        --ground: #0c1012;
        --panel: #141b1d;
        --panel-2: #1a2427;
        --row: #10171a;
        --row-hi: #16221f;
        --line: rgba(120, 200, 190, 0.14);
        --line-strong: rgba(120, 200, 190, 0.28);
        --text: #e6efec;
        --muted: #7d8f8b;
        --faint: #566461;
        --accent: #31d9c0;
        --accent-dim: #1c8a7c;
        --pulse: #ffb14e;
        --pulse-off: #4a3a22;
        --shadow: rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        touch-action: manipulation;
        background:
          radial-gradient(120% 90% at 50% -10%, rgba(49, 217, 192, 0.06), transparent 55%),
          var(--ground);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: clamp(14px, 4vw, 40px);
      }

      .mono {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      .unit {
        width: 100%;
        max-width: 540px;
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        box-shadow: 0 24px 60px -20px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.04);
        overflow: hidden;
      }

      /* ---- Header ---- */
      header {
        padding: 22px 22px 20px;
        border-bottom: 1px solid var(--line);
      }
      .eyebrow {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .eyebrow::before {
        content: "";
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      h1 {
        margin: 10px 0 4px;
        font-size: clamp(30px, 9vw, 42px);
        letter-spacing: -0.02em;
        font-weight: 800;
        line-height: 1;
        text-wrap: balance;
      }
      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
        max-width: 42ch;
      }

      /* ---- Tempo control ---- */
      .tempo {
        padding: 20px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(49,217,192,0.03), transparent);
      }
      .tempo-label {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        flex-basis: 100%;
      }
      .stepper {
        display: flex;
        align-items: stretch;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        overflow: hidden;
        background: var(--row);
      }
      .stepper button {
        width: 46px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .stepper button:hover { background: var(--row-hi); color: var(--accent); }
      .stepper button:active { background: var(--panel-2); }
      #bpm {
        width: 96px;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 40px;
        font-weight: 700;
        text-align: center;
        padding: 8px 0;
        -moz-appearance: textfield;
        letter-spacing: -0.01em;
      }
      #bpm::-webkit-outer-spin-button,
      #bpm::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      #bpm:focus-visible { outline: none; }
      .stepper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49,217,192,0.18); }
      .unit-suffix {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        color: var(--faint);
        letter-spacing: 0.14em;
        align-self: center;
      }
      .tap-btn {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        border: 1px solid var(--line-strong);
        background: var(--row);
        color: var(--text);
        border-radius: 12px;
        padding: 9px 18px;
        cursor: pointer;
        transition: transform 0.06s, border-color 0.12s, background 0.12s;
        -webkit-tap-highlight-color: transparent;
      }
      .tap-btn .k {
        font-family: ui-monospace, Menlo, monospace;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.16em;
      }
      .tap-btn .hint {
        font-size: 10px;
        color: var(--faint);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .tap-btn:hover { border-color: var(--accent-dim); }
      .tap-btn:active { transform: scale(0.96); }
      .tap-btn.lit { border-color: var(--pulse); box-shadow: 0 0 0 3px rgba(255,177,78,0.16); }

      /* ---- Rows ---- */
      .rows { padding: 6px; }
      .row {
        display: grid;
        grid-template-columns: 1fr auto auto 44px;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-radius: 11px;
        transition: background 0.14s;
      }
      .row + .row { border-top: 1px solid var(--line); }
      .row.active { background: var(--row-hi); }
      .row.active + .row { border-top-color: transparent; }

      .name-cell { min-width: 0; display: flex; align-items: center; gap: 10px; }
      .led {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: var(--pulse-off);
        flex-shrink: 0;
        transition: background 0.09s ease-out, box-shadow 0.09s ease-out, transform 0.09s ease-out;
      }
      .led.beat {
        background: var(--pulse);
        box-shadow: 0 0 12px 1px var(--pulse);
        transform: scale(1.35);
      }
      .name-text { min-width: 0; }
      .name {
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .ratio {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: var(--faint);
        letter-spacing: 0.02em;
      }

      .bpm-cell { text-align: right; }
      .bpm-val {
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        color: var(--text);
      }
      .row.active .bpm-val { color: var(--accent); }
      .bpm-cell .u, .ms-cell .u {
        font-size: 9.5px;
        letter-spacing: 0.14em;
        color: var(--faint);
        text-transform: uppercase;
        display: block;
        margin-top: 3px;
      }
      .ms-cell { text-align: right; min-width: 52px; }
      .ms-val { font-size: 14px; color: var(--muted); line-height: 1; }

      .play {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line-strong);
        background: var(--row);
        color: var(--text);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: transform 0.06s, border-color 0.14s, background 0.14s, color 0.14s;
        -webkit-tap-highlight-color: transparent;
      }
      .play:hover { border-color: var(--accent-dim); color: var(--accent); }
      .play:active { transform: scale(0.92); }
      .play svg { width: 15px; height: 15px; display: block; }
      .row.active .play {
        background: var(--accent);
        border-color: var(--accent);
        color: #04110f;
      }

      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

      @media (max-width: 380px) {
        .row { grid-template-columns: 1fr auto 40px; gap: 8px; }
        .ms-cell { display: none; }
        .play { width: 40px; height: 40px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .led.beat { transform: none; }
        * { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>

  <body>
    <main class="unit">
      <header>
        <div class="eyebrow">Tap Tempo Calculator</div>
        <h1>Subdiv</h1>
      </header>

      <section class="tempo">
        <span class="tempo-label">Song Tempo</span>
        <div class="stepper">
          <button type="button" id="down" aria-label="Decrease tempo">–</button>
          <input id="bpm" class="mono" type="number" inputmode="numeric" min="20" max="400" step="1" value="120" aria-label="Song tempo in BPM">
          <button type="button" id="up" aria-label="Increase tempo">+</button>
        </div>
        <span class="unit-suffix">BPM</span>
        <button type="button" class="tap-btn" id="tap">
          <span class="k">TAP</span>
        </button>
      </section>

      <div class="rows mono" id="rows"></div>
    </main>

    <script>
      (function () {
        "use strict";

        var SUBDIVISIONS = [
          { name: "Half note",      mult: 2 },
          { name: "Dotted quarter", mult: 1.5 },
          { name: "Quarter note",   mult: 1 },
          { name: "Quarter triplet",mult: 2 / 3 },
          { name: "Dotted 8th",     mult: 0.75 },
          { name: "8th note",       mult: 0.5 },
          { name: "8th triplet",    mult: 1 / 3 }
        ];

        var PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
        var STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>';

        var rowsEl = document.getElementById("rows");
        var bpmInput = document.getElementById("bpm");
        var rows = [];

        function ratioLabel(m) {
          if (m === 2 / 3) return "×0.667";
          if (m === 1 / 3) return "×0.333";
          if (m === 1 / 6) return "×0.167";
          return "×" + m;
        }

        SUBDIVISIONS.forEach(function (sd, i) {
          var row = document.createElement("div");
          row.className = "row";
          row.innerHTML =
            '<div class="name-cell">' +
              '<span class="led"></span>' +
              '<span class="name-text">' +
                '<span class="name">' + sd.name + '</span><br>' +
              '</span>' +
            '</div>' +
            '<div class="bpm-cell"><span class="bpm-val">0</span><span class="u">bpm</span></div>' +
            '<div class="ms-cell"><span class="ms-val">0</span><span class="u">ms</span></div>' +
            '<button type="button" class="play" aria-label="Play metronome for ' + sd.name + '">' + PLAY_SVG + '</button>';

          rowsEl.appendChild(row);
          var rec = {
            el: row,
            mult: sd.mult,
            led: row.querySelector(".led"),
            bpmVal: row.querySelector(".bpm-val"),
            msVal: row.querySelector(".ms-val"),
            btn: row.querySelector(".play"),
            bpm: 0
          };
          rows.push(rec);
          rec.btn.addEventListener("click", function () { toggle(i); });
        });

        function recalc() {
          var song = clampBpm(parseFloat(bpmInput.value) || 0);
          rows.forEach(function (r) {
            var tapBpm = song / r.mult;
            r.bpm = Math.round(tapBpm);
            r.bpmVal.textContent = r.bpm;
            r.msVal.textContent = tapBpm > 0 ? Math.round(60000 / tapBpm) : 0;
          });
          if (activeIndex !== -1) currentBpm = rows[activeIndex].bpm;
        }

        function clampBpm(v) {
          if (!v || v < 20) return v < 20 && v > 0 ? v : 20;
          if (v > 400) return 400;
          return v;
        }

        bpmInput.addEventListener("input", recalc);
        bpmInput.addEventListener("change", function () {
          var v = Math.round(clampBpm(parseFloat(bpmInput.value) || 120));
          bpmInput.value = v;
          recalc();
        });
        document.getElementById("up").addEventListener("click", function () { nudge(1); });
        document.getElementById("down").addEventListener("click", function () { nudge(-1); });
        function nudge(d) {
          bpmInput.value = Math.round(clampBpm((parseFloat(bpmInput.value) || 120) + d));
          recalc();
        }

        /* ---------- Tap tempo (set the song BPM by ear) ---------- */
        var tapBtn = document.getElementById("tap");
        var tapTimes = [];
        var tapReset = null;
        tapBtn.addEventListener("click", function () {
          var now = performance.now();
          if (tapReset) clearTimeout(tapReset);
          tapReset = setTimeout(function () { tapTimes = []; }, 2000);
          tapTimes.push(now);
          if (tapTimes.length > 6) tapTimes.shift();
          if (tapTimes.length >= 2) {
            var intervals = 0;
            for (var i = 1; i < tapTimes.length; i++) intervals += tapTimes[i] - tapTimes[i - 1];
            var avg = intervals / (tapTimes.length - 1);
            var bpm = Math.round(clampBpm(60000 / avg));
            bpmInput.value = bpm;
            recalc();
          }
          tapBtn.classList.add("lit");
          setTimeout(function () { tapBtn.classList.remove("lit"); }, 110);
        });

        /* ---------- Metronome (Web Audio, lookahead scheduler) ---------- */
        var audioCtx = null;
        var activeIndex = -1;
        var currentBpm = 0;
        var nextNoteTime = 0;
        var timerId = null;
        var LOOKAHEAD = 25;       // ms, how often the scheduler runs
        var SCHEDULE_AHEAD = 0.1; // s, how far ahead to schedule audio

        function toggle(i) {
          if (activeIndex === i) { stop(); return; }
          start(i);
        }

        function start(i) {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          if (activeIndex !== -1) deactivate(activeIndex);

          activeIndex = i;
          currentBpm = rows[i].bpm;
          rows[i].el.classList.add("active");
          rows[i].btn.innerHTML = STOP_SVG;
          rows[i].btn.setAttribute("aria-label", "Stop metronome");

          nextNoteTime = audioCtx.currentTime + 0.06;
          scheduler();
        }

        function stop() {
          if (activeIndex !== -1) deactivate(activeIndex);
          activeIndex = -1;
          if (timerId) { clearTimeout(timerId); timerId = null; }
        }

        function deactivate(i) {
          rows[i].el.classList.remove("active");
          rows[i].led.classList.remove("beat");
          rows[i].btn.innerHTML = PLAY_SVG;
          rows[i].btn.setAttribute("aria-label", "Play metronome");
        }

        function scheduler() {
          if (activeIndex === -1 || !currentBpm) return;
          var secondsPerBeat = 60 / currentBpm;
          while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
            scheduleClick(nextNoteTime);
            flashLed(nextNoteTime);
            nextNoteTime += secondsPerBeat;
          }
          timerId = setTimeout(scheduler, LOOKAHEAD);
        }

        function scheduleClick(t) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(1250, t);
          osc.frequency.exponentialRampToValueAtTime(760, t + 0.03);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.06);
        }

        function flashLed(t) {
          var idx = activeIndex;
          var delay = Math.max(0, (t - audioCtx.currentTime) * 1000);
          setTimeout(function () {
            if (activeIndex !== idx) return;
            var led = rows[idx].led;
            led.classList.add("beat");
            setTimeout(function () { led.classList.remove("beat"); }, 70);
          }, delay);
        }

        recalc();
      })();
    </script>
  </body>
</html>
