<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0c1012">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Subdiv">
    <title>Subdiv — Tap Tempo Subdivision Calculator</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="apple-splash/splash-750x1334.png">
    <link rel="apple-touch-startup-image" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1080x2340.png">
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1125x2436.png">
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1170x2532.png">
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1179x2556.png">
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1206x2622.png">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="apple-splash/splash-828x1792.png">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1242x2688.png">
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1284x2778.png">
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1290x2796.png">
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="apple-splash/splash-1320x2868.png">
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <main class="unit">
      <header>
        <div class="eyebrow">Tap Tempo Calculator</div>
        <div class="title-row">
          <img class="logo" src="icon-192.png" alt="" width="44" height="44">
          <h1>Subdiv</h1>
        </div>
      </header>

      <section class="tempo">
        <span class="tempo-label">Song Tempo (BPM)</span>
        <div class="stepper">
          <button type="button" id="down" aria-label="Decrease tempo">–</button>
          <input id="bpm" class="mono" type="number" inputmode="numeric" min="20" max="400" step="1" value="120" aria-label="Song tempo in BPM">
          <button type="button" id="up" aria-label="Increase tempo">+</button>
        </div>
        <button type="button" class="tap-btn" id="tap">
          <span class="k">TAP</span>
        </button>
      </section>

      <div class="rows mono" id="rows"></div>

      <div class="transport" id="transport" hidden>
        <span class="playing-count" id="playingCount" role="status" aria-live="polite"></span>
        <button type="button" class="stop-all" id="stopAll">Stop all</button>
      </div>
    </main>

    <div class="scanlines" aria-hidden="true"></div>

    <script src="app.js" defer></script>
  </body>
</html>
